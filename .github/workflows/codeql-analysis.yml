name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      languages:
        description: "Languages to analyze"
        required: true
        default: "c-cpp"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: 'ubuntu-latest'
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.build-mode == 'manual'
        name: Manual Build (skip unsupported headers)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkgconf \
            unixodbc-dev \
            libmysqlclient-dev \
            libpq-dev \
            libsqlite3-dev \
            libmongoc-1.0-0 \
            libmongoc-dev \
            libbson-1.0-0 \
            libbson-dev \
            libarchive-dev \
            libxml2-dev \
            libpq-dev \
            libssl-dev

          for src in *.c; do
            # Skip files that include unsupported Windows-only headers
            if grep -q "mbstring.h" "$src"; then
              echo "⏩ Skipping $src due to unsupported header: mbstring.h"
              continue
            fi
            gcc -c "$src" -o "${src%.c}.out" \
              -Wall -Wformat-security \
              $(pkg-config --cflags libxml-2.0 libmongoc-1.0 libpq openssl) \
              $(pkg-config --libs libxml-2.0 libmongoc-1.0 libpq openssl) \
              -lmysqlclient -lsqlite3 -lodbc -larchive
          done

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
